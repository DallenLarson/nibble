name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Reading the repository is enough for a build; publishing a release needs write. Asking for
# it here rather than changing the repository's default keeps every other workflow read-only.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Inno Setup is only needed to turn a tag into a release with an installer; on a
      # normal push package.ps1 builds the browser and says the installer was skipped.
      - name: Inno Setup (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --no-progress -y

      - name: Build, package and check
        shell: pwsh
        run: |
          ./tools/package.ps1
          ./tools/verify.ps1

      # A tag is a release, and a release without its installer is not one. package.ps1 skips
      # the installer when it cannot find Inno Setup, which is right for a normal push and
      # wrong here - so say so loudly instead of shipping half an artifact set.
      - name: A release must have its installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Nibble-*-Setup.exe -ErrorAction SilentlyContinue
          if (-not $setup) { throw "no Setup.exe was built - Inno Setup is missing on this runner" }
          "installer: $($setup.Name) ($($setup.Length) bytes)"

      - name: Upload the browser
        uses: actions/upload-artifact@v4
        with:
          name: Nibble
          path: dist/**

      # Tagging v1.0.0 turns the same build into a release, with the installer if Inno
      # Setup was installed in the step above. The notes come from the file that matches
      # the tag, so the release text lives in the repository next to the code it describes
      # (docs/release-notes-v1.0.0.md) instead of being generated from commit titles.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes-${{ github.ref_name }}.md
          files: |
            dist/Nibble.exe
            dist/Nibble-*-Setup.exe
